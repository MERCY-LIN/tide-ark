<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>潮汐方舟 · Tide Ark</title>
<style>
﻿/* ============================================================
   潮汐方舟  Tide Ark  —— 样式
   ============================================================ */
* { box-sizing: border-box; }

html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #05090d;
  color: #cfe0ea;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

#app {
  display: grid;
  grid-template-rows: 52px minmax(0, 1fr) auto;
  grid-template-columns: minmax(0, 1fr);
  height: 100%;
}

/* ---------------- 顶栏 ---------------- */
#hud {
  display: flex; align-items: center; gap: 14px;
  padding: 0 18px;
  background: linear-gradient(#0c1a26, #08131c);
  border-bottom: 1px solid #16293a;
  position: relative; z-index: 5;
}

.brand {
  font-size: 17px; letter-spacing: 3px; font-weight: 700;
  color: #dff0f8;
  text-shadow: 0 0 18px rgba(90, 200, 240, .35);
  white-space: nowrap;
}
.brand em {
  font-style: normal; font-size: 10px; letter-spacing: 2px;
  color: #4d7f96; margin-left: 8px; font-weight: 400;
}

.chip {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 12px; border-radius: 999px;
  background: #0e2130; border: 1px solid #1b374b;
  font-size: 13px; white-space: nowrap;
}
.chip b { color: #f2e2b8; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip .lbl { color: #5d8ba1; font-size: 12px; }
.chip.wood b { color: #e8c07a; }
.chip.hp b { color: #86e0b0; }
.chip.tide b { color: #7fc8e8; }

.bar {
  width: 108px; height: 7px; border-radius: 4px;
  background: #0a1620; overflow: hidden;
  box-shadow: inset 0 0 0 1px #14293a;
}
.bar i {
  display: block; height: 100%; width: 100%;
  background: linear-gradient(90deg, #37c98f, #8ff0c4);
  transition: width .25s ease;
}
.bar.tide i { background: linear-gradient(90deg, #2f8fb5, #8fe4ff); }
.bar.low i { background: linear-gradient(90deg, #d1553f, #f3a06a); }

.spacer { flex: 1; }

#phaseTag {
  font-size: 12px; letter-spacing: 1px; color: #7fb6cc;
  padding: 4px 10px; border-radius: 6px;
  background: rgba(40, 120, 150, .14);
  border: 1px solid rgba(60, 150, 180, .28);
}

/* ---------------- 舞台 ---------------- */
#stage {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  padding: 10px; min-height: 0; min-width: 0; overflow: hidden;
  background: radial-gradient(ellipse at 50% 0%, #0d2130 0%, #05090d 70%);
}
canvas#cv {
  display: block;
  max-width: 100%; max-height: 100%;
  width: auto; height: auto;
  touch-action: none;
  border-radius: 12px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, .75), 0 0 0 1px #14293a;
  cursor: default;
}
canvas#cv.placing { cursor: crosshair; }

#preview {
  position: absolute; left: 22px; top: 18px;
  padding: 8px 12px; border-radius: 8px;
  background: rgba(8, 20, 29, .82);
  border: 1px solid #1d3a4d;
  font-size: 12px; line-height: 1.7; color: #9dc4d6;
  pointer-events: none; max-width: min(380px, 46vw);
  backdrop-filter: blur(3px);
}
#preview .k { color: #6fa3ba; }
#preview b { color: #ffcf8a; }
#preview .warn { color: #ff8b6b; }

/* ---------------- 底部坞 ---------------- */
#dock {
  display: flex; flex-direction: column; gap: 7px;
  padding: 10px 16px;
  background: linear-gradient(#08131c, #0a1824);
  border-top: 1px solid #16293a;
  position: relative; z-index: 5;
}

#dockMain { display: flex; gap: 12px; width: 100%; align-items: center; }

#augbar { display: none; gap: 7px; align-items: center; flex-wrap: wrap; }
#augbar.on { display: flex; }
#augbar .lbl { font-size: 11px; color: #5f8ea4; letter-spacing: 1px; margin-right: 2px; }
.augchip {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 10px 4px 6px; border-radius: 7px;
  background: #12222f; border: 1px solid #23475c;
  color: #b9d4e2; font-size: 12px; cursor: pointer;
  font-family: inherit; transition: .12s;
}
.augchip:hover { border-color: #4a8fb0; background: #17334a; }
.augchip.on { border-color: #ffcf8a; box-shadow: 0 0 0 1px #ffcf8a; color: #ffe9c4; }
.augchip canvas { width: 20px; height: 20px; }

#palette {
  display: flex; gap: 7px; flex: 1; min-width: 0;
  overflow-x: auto; overflow-y: hidden;
  padding-bottom: 2px;
  scrollbar-width: thin;
}
#palette::-webkit-scrollbar { height: 6px; }
#palette::-webkit-scrollbar-track { background: #0a1721; border-radius: 3px; }
#palette::-webkit-scrollbar-thumb { background: #1d3a4d; border-radius: 3px; }

.card {
  position: relative;
  flex: 0 0 78px; width: 78px; height: 100px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  gap: 2px; padding: 7px 4px 5px;
  border-radius: 9px;
  background: linear-gradient(#12222f, #0c1922);
  border: 1px solid #1d3446;
  color: #b9d4e2;
  cursor: pointer;
  transition: transform .1s, border-color .15s, box-shadow .15s, background .15s;
  font-family: inherit;
}
.card:hover { transform: translateY(-3px); border-color: #3a6a86; }
.card.selected {
  border-color: #ffcf8a;
  box-shadow: 0 0 0 1px #ffcf8a, 0 0 22px rgba(255, 200, 120, .3);
  background: linear-gradient(#1d2c33, #14212a);
}
.card.off { opacity: .38; cursor: not-allowed; }
.card.off:hover { transform: none; border-color: #1d3446; }
.card canvas { display: block; width: 34px; height: 34px; }
.card .nm { font-size: 12px; letter-spacing: .5px; line-height: 1.1; }
.card .cost {
  font-size: 11px; color: #e8c07a; font-variant-numeric: tabular-nums;
}
.card .cost.free { color: #86e0b0; }
.card .badge {
  position: absolute; top: 3px; right: 4px;
  font-size: 10px; padding: 0 5px; border-radius: 8px;
  background: #2c7a5b; color: #d8ffef; line-height: 15px;
  display: none;
}
.card .badge.on { display: block; }

#actions { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
#actions .row { display: flex; gap: 6px; }

button.btn {
  font-family: inherit; font-size: 13px; letter-spacing: .5px;
  padding: 9px 16px; border-radius: 8px; cursor: pointer;
  border: 1px solid #24455c; background: #102232; color: #a8c8d9;
  transition: .15s; white-space: nowrap;
}
button.btn:hover { background: #17334a; border-color: #376b8a; color: #d9eefb; }
button.btn:active { transform: translateY(1px); }
button.btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }

button.primary {
  background: linear-gradient(#1f6f8f, #16546e);
  border-color: #3d9bc0; color: #eafaff;
  font-size: 15px; font-weight: 700; letter-spacing: 2px;
  box-shadow: 0 0 24px rgba(60, 170, 210, .28);
}
button.primary:hover {
  background: linear-gradient(#2580a4, #1a6585);
  box-shadow: 0 0 34px rgba(70, 190, 235, .45);
}
button.danger { border-color: #6d3b36; color: #e0a79c; }

/* ---------------- 弹窗 ---------------- */
#modal {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  background: rgba(3, 8, 12, .78);
  backdrop-filter: blur(4px);
}
#modal.hidden { display: none; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.modal-box {
  width: min(760px, 92vw);
  max-height: 86vh; overflow-y: auto;
  padding: 26px 28px 24px;
  border-radius: 14px;
  background: linear-gradient(#0f1e2a, #0a151d);
  border: 1px solid #224355;
  box-shadow: 0 30px 90px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .04);

}
@keyframes pop { from { transform: translateY(14px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }

.modal-box h2 {
  margin: 0 0 4px; font-size: 22px; letter-spacing: 3px; color: #e6f4fb;
  font-weight: 700;
}
.modal-box .sub { color: #6f9db4; font-size: 13px; margin-bottom: 18px; letter-spacing: .5px; }
.modal-box p { line-height: 1.9; color: #9dc0d2; font-size: 14px; margin: 8px 0; }
.modal-box .hl { color: #ffcf8a; }
.modal-box .ok { color: #86e0b0; }
.modal-box .bad { color: #ff9c86; }

.picks { display: flex; gap: 14px; margin: 18px 0 6px; }
.pick {
  flex: 1; padding: 16px 14px; border-radius: 11px;
  background: linear-gradient(#14252f, #0e1c25);
  border: 1px solid #234454; cursor: pointer;
  transition: .16s; text-align: center; position: relative;
}
.pick:hover {
  border-color: #ffcf8a; transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(255, 190, 110, .16);
  background: linear-gradient(#1c2f39, #12222c);
}
.pick canvas { display: block; margin: 2px auto 8px; width: 44px; height: 44px; }
.pick .pn { font-size: 15px; color: #e7f5fd; letter-spacing: 1px; font-weight: 700; }
.pick .pd { font-size: 12px; color: #7fa9bd; margin-top: 7px; line-height: 1.6; min-height: 38px; }
.pick .pt {
  position: absolute; top: 9px; left: 10px; font-size: 10px;
  color: #5f8ea4; letter-spacing: 1px;
  border: 1px solid #26485b; border-radius: 4px; padding: 1px 5px;
}
.pick.big .pn { font-size: 20px; }

.infogrid { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 14px 0; font-size: 13.5px; }
.infogrid .k { color: #6f9db4; }
.infogrid .v { color: #cfe6f2; }

.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

/* ---------------- 提示 ---------------- */
#tip {
  position: fixed; z-index: 60; pointer-events: none;
  max-width: 240px; padding: 9px 12px; border-radius: 8px;
  background: rgba(6, 16, 23, .95);
  border: 1px solid #2a4f65;
  font-size: 12px; line-height: 1.6; color: #b8d6e4;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
  opacity: 0; transition: opacity .12s;
}
#tip.on { opacity: 1; }
#tip .tn { color: #ffcf8a; font-size: 13px; letter-spacing: 1px; margin-bottom: 3px; }
#tip .td { color: #8fb6c8; }
#tip .tc { color: #e8c07a; margin-top: 4px; }

#toast {
  position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%) translateY(8px);
  z-index: 70; padding: 9px 20px; border-radius: 999px;
  background: rgba(10, 24, 33, .95); border: 1px solid #2f5b72;
  color: #d9edf7; font-size: 13px; letter-spacing: 1px;
  opacity: 0; transition: .22s; pointer-events: none;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 帮助键 */
.hintline {
  color: #4f7d92; font-size: 12px; letter-spacing: .5px; margin-top: 10px;
}

/* ---------------- 船坞 / 局外改装 ---------------- */
.pick.locked { opacity: .6; }
.pick.locked:hover { transform: none; border-color: #234454; box-shadow: none; }

.metalist { display: flex; flex-direction: column; gap: 8px; margin: 16px 0 4px; }
.meta-row {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas: "n c" "d d";
  gap: 3px 14px;
  padding: 11px 14px;
  border-radius: 9px;
  background: #0e1c25;
  border: 1px solid #234454;
  cursor: pointer;
  transition: .15s;
}
.meta-row:hover { border-color: #3a6a86; background: #13242f; }
.meta-row.maxed { opacity: .45; cursor: default; }
.meta-row.maxed:hover { border-color: #234454; background: #0e1c25; }
.meta-row.can .mc { color: #86e0b0; }
.meta-row .mn { grid-area: n; font-size: 14px; color: #dbeef8; letter-spacing: .5px; }
.meta-row .lv { font-size: 11px; color: #5f8ea4; margin-left: 8px; }
.meta-row .md { grid-area: d; font-size: 12px; color: #7fa9bd; line-height: 1.5; }
.meta-row .mc { grid-area: c; font-size: 13px; color: #e8c07a; align-self: center; font-variant-numeric: tabular-nums; }
/* ---------------- 潮汐刻度 ---------------- */
.ascrow {
  display: flex; align-items: center; gap: 10px;
  margin: 16px 0 4px; padding: 10px 14px;
  border-radius: 9px; background: #0c1922; border: 1px solid #1d3446;
}
.ascrow .btn { padding: 5px 13px; font-size: 15px; line-height: 1; }
.ascval { flex: 1; font-size: 13px; color: #9dc4d6; letter-spacing: .5px; }
.ascval b { color: #ffcf8a; font-size: 16px; margin: 0 2px; }
.aschint { display: block; font-size: 11px; color: #517b90; margin-top: 3px; }
/* ---------------- 契约 ---------------- */
.ctrow {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  margin: 8px 0 4px; padding: 9px 14px;
  border-radius: 9px; background: #0c1922; border: 1px solid #1d3446;
}
.ctrow .lbl { font-size: 12px; color: #6f9db4; letter-spacing: 1px; margin-right: 3px; }
.cthint { font-size: 11px; color: #3f6678; margin-left: auto; }
.ctchip {
  padding: 5px 11px; border-radius: 7px;
  background: #12222f; border: 1px solid #23475c;
  color: #b9d4e2; font-size: 12px; cursor: pointer;
  font-family: inherit; transition: .12s;
}
.ctchip:hover { border-color: #4a8fb0; background: #17334a; }
.ctchip.on { border-color: #ffcf8a; box-shadow: 0 0 0 1px #ffcf8a; color: #ffe9c4; }
.metalist.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 620px) { .metalist.two { grid-template-columns: 1fr; } }
/* ---------------- 成就 ---------------- */
.achlist { display: flex; flex-direction: column; gap: 7px; margin: 16px 0 4px; }
.achrow {
  display: grid; grid-template-columns: 1fr auto;
  grid-template-areas: "n r" "d d";
  gap: 2px 14px; padding: 10px 14px;
  border-radius: 9px; background: #0e1c25; border: 1px solid #1f3a4b;
}
.achrow.got { border-color: #3f8f6d; background: #10251f; }
.achrow .an { grid-area: n; font-size: 13.5px; color: #cfe0ea; }
.achrow.got .an { color: #8ff0c4; }
.achrow .ad { grid-area: d; font-size: 12px; color: #7fa9bd; }
.achrow .ar { grid-area: r; font-size: 12px; color: #e8c07a; align-self: center; }
.achrow.got .ar { color: #8ff0c4; }
.achlist.two { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
@media (max-width: 620px) { .achlist.two { grid-template-columns: 1fr; } }
/* ---------------- 自适应 ---------------- */
@media (max-width: 1180px) {
  .card { flex: 0 0 70px; width: 70px; height: 92px; }
  .card canvas { width: 28px; height: 28px; }
  .card .nm { font-size: 11px; }
  #preview { font-size: 11px; padding: 6px 10px; }
}

@media (max-width: 920px) {
  #hud { gap: 8px; padding: 0 10px; }
  .brand { font-size: 15px; letter-spacing: 2px; }
  .brand em { display: none; }
  .chip { padding: 4px 9px; font-size: 12px; }
  .chip .lbl { font-size: 11px; }
  .bar { width: 64px; }
  .card { flex: 0 0 62px; width: 62px; height: 84px; padding: 5px 3px 3px; gap: 1px; }
  .card canvas { width: 24px; height: 24px; }
  .card .nm { font-size: 10px; }
  .card .cost { font-size: 10px; }
  #dock { padding: 8px 10px; gap: 6px; }
  #actions .btn { padding: 7px 11px; font-size: 12px; }
  #preview { font-size: 10.5px; left: 12px; top: 10px; line-height: 1.6; }
  .augchip { padding: 3px 8px 3px 5px; font-size: 11px; }
}

@media (max-height: 760px) {
  .card { height: 84px; }
  #dock { padding: 8px 14px 8px; }
  #preview { max-height: 46vh; overflow: hidden; }
}

@media (max-height: 640px) {
  .card { height: 74px; }
  .card canvas { width: 22px; height: 22px; }
  .card .cost { display: none; }
  #hud { height: 44px; }
}
@media (max-width: 620px) {
  .chip.tide, #phaseTag { display: none; }
  .brand { font-size: 13px; letter-spacing: 1px; }
  .brand em { display: none; }
  .chip { padding: 3px 7px; font-size: 11px; }
  .bar { width: 48px; }
  #preview { max-width: 64vw; font-size: 10px; padding: 5px 8px; }
  #dock { padding: 6px 8px; }
  #actions .btn { padding: 6px 9px; font-size: 11px; }
  .card { flex: 0 0 56px; width: 56px; height: 76px; }
  .card canvas { width: 20px; height: 20px; }
  .card .nm { font-size: 9.5px; }
  .card .cost { display: none; }
}
</style>
</head>
<body>
<div id="app">

  <header id="hud">
    <div class="brand">潮汐方舟<em>TIDE ARK</em></div>
    <div class="chip"><span class="lbl">潮汐</span><b id="sWave">1 / 8</b></div>
    <div class="chip wood"><span class="lbl">木材</span><b id="sWood">40</b></div>
    <div class="chip hp"><span class="lbl">耐久</span><b id="sHp">160 / 160</b>
      <div class="bar" id="hpBar"><i style="width:100%"></i></div>
    </div>
    <div class="spacer"></div>
    <div class="chip tide"><span class="lbl">潮位</span><div class="bar tide"><i id="tideFill" style="width:0%"></i></div></div>
    <div id="phaseTag">建造</div>
  </header>

  <main id="stage">
    <canvas id="cv" width="1120" height="560"></canvas>
    <div id="preview"></div>
  </main>

  <footer id="dock">
    <div id="augbar"></div>
    <div id="dockMain">
    <div id="palette"></div>
    <div id="actions">
      <div class="row">
        <button class="btn" id="btnDive">下潜 +25木</button>
        <button class="btn" id="btnHelp">玩法</button>
      </div>
      <div class="row">
        <button class="btn" id="btnFast" style="display:none">瞬间结算</button>
        <button class="btn" id="btnSpeed" style="display:none">1×</button>
        <button class="btn primary" id="btnTide">涨 潮 ▶</button>
      </div>
    </div>
    </div>
  </footer>

</div>

<div id="modal" class="hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="tip"></div>
<div id="toast"></div>

<script>
/* ==== data.js ==== */
﻿/* ============================================================
   潮汐方舟  Tide Ark  v0.2
   data.js —— 纯数值与内容表（无 DOM 依赖）
   ============================================================ */
(function (root) {
  'use strict';

  /* ---------- 舞台几何 ---------- */
  var CELL = 58;
  var COLS = 6;
  var ROWS = 3;
  var VIEW_W = 1120;
  var VIEW_H = 560;
  var RAFT_W = COLS * CELL;                 // 348
  var RAFT_X = (VIEW_W - RAFT_W) / 2;       // 386
  var RAFT_Y = 268;
  var RAFT_H = ROWS * CELL;                 // 174
  var WATER_LOW = RAFT_Y + 2 * CELL;        // 384 低潮水位
  var WATER_HIGH = 300;                     // 满潮水位
  var FLOOD_Y = RAFT_Y + CELL;              // 326 越过这里主甲板进水

  var ROW_LANE = ['air', 'surface', 'under'];
  var ROW_NAME = ['高空甲板', '主甲板', '水下舱'];

  /* ---------- 甲板：一开始只有中间两列 ---------- */
  var START_COLS = [2, 3];
  /* 只能买"挨着已解锁列"的列；外挂列最贵，但它决定你能打多远 */
  var EXPAND = [
    { col: 1, cost: 30, hp: 20 },
    { col: 4, cost: 30, hp: 20 },
    { col: 0, cost: 50, hp: 30 },
    { col: 5, cost: 50, hp: 30 }
  ];

  /* ---------- 模块 ---------- */
  var MODULES = {
    flak: {
      name: '高射炮', row: 0, kind: 'weapon', lane: 'air', cost: 16,
      dmg: 15, cd: 0.8, range: 6, color: '#7fc8e8', icon: 'flak',
      desc: '对空 · 射程 6 列 · 15 伤害'
    },
    salvage: {
      name: '打捞臂', row: 0, kind: 'utility', effect: 'salvage', cost: 15,
      color: '#d4a373', icon: 'salvage',
      desc: '每波结束额外 +8 木材'
    },
    ballista: {
      name: '弩炮', row: 1, kind: 'weapon', lane: 'surface', cost: 12,
      dmg: 16, cd: 1.05, range: 6, color: '#e0a458', icon: 'bolt',
      desc: '对海 · 射程 6 列 · 16 伤害'
    },
    flamer: {
      name: '喷火器', row: 1, kind: 'weapon', lane: 'surface', cost: 18,
      dmg: 8, cd: 0.3, range: 2.5, radius: 70, color: '#e2703a', icon: 'flame',
      desc: '对海 · 近距范围灼烧 · 8 伤害'
    },
    tesla: {
      name: '电击塔', row: 1, kind: 'weapon', lane: 'any', cost: 26,
      dmg: 12, cd: 1.2, range: 4, chain: 3, color: '#f2e06b', icon: 'tesla',
      desc: '全泳道 · 连锁 3 目标 · 12 伤害'

      magEach: 0.25,
      magCap: 0.5,
      boostMul: 1.2,
      aoeMul: 1,
      fireBurst: 0,
      expandMul: 1,
      rangeMul: 1,
      rowRange: [0, 0, 0],
      rowShield: [0, 0, 0],
      underRange: 0
    };
    var cells = cellsOf(run);

    /* --- 起始船被动 --- */
    var ship = D.SHIPS[run.ship] || D.SHIPS.barge;
    if (ship.perk === 'dmg') st.dmgMul *= 1.25;

    /* --- 遗物 --- */
    var R = run.relics || [];
    var has = function (k) { return R.indexOf(k) >= 0; };
    if (has('searchlight')) st.rangeBonus += 1;
    if (has('ram')) st.maxHp += 60;
    if (has('autoloader')) st.rateMul *= 0.87;
    if (has('ap')) st.dmgMul *= 1.15;
    if (has('net')) st.salvage += 15;
    if (has('depthrack')) st.laneDmg.under += 0.4;
    if (has('radar')) st.laneDmg.air += 0.4;
    if (has('bilge')) st.tideMul *= 0.85;
    if (has('spares')) st.repairPerWave += 15;
    if (has('twin')) { st.magEach = 0.5; st.magCap = 0.75; }

    /* --- 羁绊：按标签计数 --- */
    var tagCount = { gun: 0, fire: 0, mech: 0 };
    cells.forEach(function (x) {
      var t = D.TAG_OF[x.id];
      if (t) tagCount[t]++;
    });
    st.tags = tagCount;
    if (tagCount.gun >= 4) { st.dmgMul *= 1.20; st.rangeBonus += 1; }
    else if (tagCount.gun >= 2) { st.dmgMul *= 1.08; }
    st.aoeMul = tagCount.fire >= 2 ? 1.3 : 1;
    st.fireBurst = tagCount.fire >= 4 ? 18 : 0;
    st.boostMul = tagCount.mech >= 2 ? 1.4 : 1.2;
    if (tagCount.mech >= 4) { st.salvage += 20; st.expandMul = (st.expandMul || 1) * 0.75; }

    /* --- 本局异变 --- */
    var mut = run.mut || {};
    if (mut.tide) st.tideMul *= mut.tide;
    if (mut.repair) st.repairPerWave += mut.repair;
    if (mut.underDmg) st.laneDmg.under *= mut.underDmg;
    if (mut.expand) st.expandMul = st.expandMul * mut.expand;
    if (mut.range) st.rangeMul = (st.rangeMul || 1) * mut.range;

    /* --- 契约 --- */
    var ct2 = run.contract || {};
    if (ct2.tide) st.tideMul *= ct2.tide;

    /* --- 潮汐刻度 --- */
    var am = run.ascMods || { tide: 1 };
    st.tideMul *= am.tide;

    /* --- 扩音改装：相邻武器射速加成 --- */
    st.ampRate = {};
    var augMap = run.moduleAug || {};
    cells.forEach(function (x) {
      var aid = augMap[x.c + '_' + x.r];
      var ad = aid ? D.AUGMENTS[aid] : null;
      if (!ad || !ad.aura) return;
      cells.forEach(function (y) {
        if (y.def.kind !== 'weapon') return;
        if (y.c === x.c && y.r === x.r) return;
        if (Math.abs(y.c - x.c) <= 1 && Math.abs(y.r - x.r) <= 1) {
          var k = idx(y.c, y.r);
          st.ampRate[k] = (st.ampRate[k] || 0) + ad.aura;
        }
      });
    });

    /* --- 行为型遗物 --- */
    if (has('furnace')) { st.dmgMul *= 0.85; st.fireBurst = Math.max(st.fireBurst || 0, 25); }
    if (has('doubleedge')) { st.dmgMul *= 1.3; st.maxHp = Math.round(st.maxHp * 0.65); }
    if (has('tideclock')) st.tideMul *= 0.7;

    cells.forEach(function (x) {
      var e = x.def.effect;
      if (e === 'armor') st.maxHp += 40;
      if (e === 'pump') st.pumps++;
      if (e === 'salvage') st.salvage += 8;
      if (e === 'power') st.boost[x.r] = true;
      if (e === 'repair') st.repairPerWave += 12;
      if (e === 'range') st.rowRange[x.r] += 1;
      if (e === 'shield') st.rowShield[x.r] += 0.2;
      if (e === 'sonar') st.underRange += 2;
    });
    st.maxHp += 40 * (up.hull || 0);
    st.salvage += 10 * (up.salvager || 0);
    st.tideMul = 1 - Math.min(0.45, st.pumps * 0.1 + 0.12 * (up.tide || 0));

    cells.forEach(function (x) {
      if (x.def.kind !== 'weapon') return;
      var m = 0;
      cells.forEach(function (y) {
        if (y.def.effect === 'mag' && Math.abs(y.c - x.c) <= 1 && Math.abs(y.r - x.r) <= 1) m++;
      });
      st.mag[idx(x.c, x.r)] = Math.min(st.magCap, m * st.magEach);
    });

    return st;
  }

  /* ============================================================
     建造
     ============================================================ */
  function costOf(run, id) {
    return (run.stock[id] || 0) > 0 ? 0 : D.MODULES[id].cost;
  }

  function canPlace(run, id, col, row) {
    var def = D.MODULES[id];
    if (!def) return '未知模块';
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return '超出甲板';
    if (!isUnlocked(run, col)) return '这一列还没加固';
    if (def.row >= 0 && row !== def.row) return def.name + ' 只能放在' + D.ROW_NAME[def.row];
    if (run.grid[idx(col, row)]) return '这一格已经有东西了';
    if (costOf(run, id) > run.wood) return '木材不足';
    return null;
  }

  function place(run, id, col, row) {
    var err = canPlace(run, id, col, row);
    if (err) return err;
    var cost = costOf(run, id);
    if (run.stock[id] > 0) run.stock[id]--;
    run.wood -= cost;
    run.grid[idx(col, row)] = id;
    return null;
  }

  function sell(run, col, row) {
    var id = run.grid[idx(col, row)];
    if (!id) return 0;
    var key = col + '_' + row;
    if (run.moduleAug && run.moduleAug[key]) {
      run.augments.push(run.moduleAug[key]);
      delete run.moduleAug[key];
    }
    var refund = Math.floor(D.MODULES[id].cost * 0.5);
    run.wood += refund;
    run.grid[idx(col, row)] = null;
    return refund;
  }

  function grantAug(run, augId) {
    if (D.AUGMENTS[augId]) run.augments.push(augId);
  }

  function applyAug(run, augId, col, row) {
    var key = col + '_' + row;
    var id = run.grid[idx(col, row)];
    if (!id) return '这一格是空的';
    if (D.MODULES[id].kind !== 'weapon') return '只能改装武器';
    if (run.moduleAug[key]) return '这台已经改装过了';
    var at = run.augments.indexOf(augId);
    if (at < 0) return '没有这个改装件';
    run.moduleAug[key] = augId;
    run.augments.splice(at, 1);
    return null;
  }

  function dive(run) {
    if (run.dived) return '这次潮汐已经下潜过了';
    run.dived = true;
    run.wood += 25;
    run.plan.spawns.push({ kind: 'diver', side: 'L', t: run.plan.dur * 0.2 });
    run.plan.spawns.push({ kind: 'diver', side: 'R', t: run.plan.dur * 0.38 });
    run.plan.sides = ['L', 'R'];
    run.extraDivers += 2;
    return null;
  }

  /* ============================================================
     战斗
     ============================================================ */
  function startBattle(run) {
    var st = computeStats(run);
    var plan = run.plan || planWave(run);

    var b = {
      run: run,
      st: st,
      wave: run.wave,
      plan: plan,
      mod: plan.mod,
      t: 0,
      tide: 0,
      tideDur: plan.dur,
      tideMul: st.tideMul,
      waterY: D.WATER_LOW,
      hp: run.hp,
      maxHp: st.maxHp,
      enemies: [],
      queue: plan.spawns.slice().sort(function (a, c) { return a.t - c.t; }),
      modules: [],
      tracers: [],
      particles: [],
      texts: [],
      blasts: [],
      log: [],
      seq: 1,
      result: null,
      tideChild: (run.relics || []).indexOf('tidechild') >= 0,
      enraged: false,
      killed: 0,
      dmgDealt: 0,
      leak: 0,
      leakByLane: { surface: 0, air: 0, under: 0 },
      shake: 0
    };

    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var id = run.grid[idx(c, r)];
        if (!id) continue;
        b.modules.push({
          id: id,
          def: D.MODULES[id],
          col: c,
          row: r,
          x: mx(c),
          y: my(r),
          cd: 0,
          boosted: !!st.boost[r],
          aug: (run.moduleAug && run.moduleAug[c + '_' + r]) ? D.AUGMENTS[run.moduleAug[c + '_' + r]] : null,
          ampBonus: st.ampRate ? (st.ampRate[idx(c, r)] || 0) : 0,
          mag: st.mag[idx(c, r)] || 0,
          flooded: false,
          flash: 0
        });
      }
    }
    return b;
  }

  function laneY(b, lane) {
    if (lane === 'surface') return b.waterY - 10;
    if (lane === 'air') return 226;
    return 470;
  }

  function spawn(b, s) {
    var def = D.ENEMIES[s.kind];
    var hp = def.hp * b.plan.hpMul * (def.lane === 'under' ? (b.plan.underHp || 1) : 1);
    b.enemies.push({
      id: b.seq++,
      kind: s.kind,
      def: def,
      lane: def.lane,
      side: s.side,
      x: s.side === 'L' ? -40 : D.VIEW_W + 40,
      y: laneY(b, def.lane),
      hp: hp,
      maxHp: hp,
      r: def.r,
      latched: false,
      enraged: false,
      burnT: 0, burnDps: 0, slowT: 0, slowMul: 1,
      phase: 0, spdMul: 1, dmgMul: 1,
      bob: Math.random() * 6.283,
      hit: 0,
      dead: false,
      biteCd: 0
    });
  }

  function edgeX(side) {
    return side === 'L' ? D.RAFT_X - 10 : D.RAFT_X + D.RAFT_W + 10;
  }

  function deadCheck(b) {
    for (var i = b.enemies.length - 1; i >= 0; i--) {
      if (b.enemies[i].dead) b.enemies.splice(i, 1);
    }
  }

  function burst(b, x, y, color, n, spd) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.283;
      var v = (0.4 + Math.random()) * (spd || 90);
      b.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 30,
        life: 0.35 + Math.random() * 0.35,
        max: 0.7,
        color: color,
        r: 1.5 + Math.random() * 2.5
      });
    }
  }

  function floatText(b, x, y, text, color, size) {
    b.texts.push({
      x: x, y: y, text: String(text),
      color: color || '#fff',
      size: size || 14,
      life: 0.85, max: 0.85,
      vy: -34, vx: (Math.random() - 0.5) * 18
    });
  }

  function pushLog(b, txt) {
    b.log.push({ t: b.t, txt: txt });
    if (b.log.length > 40) b.log.shift();
  }

  function hurt(b, e, amount, color, noBurst) {
    if (e.dead) return;
    var arm = (e.def.armor || 0) + (b.plan.armorBonus || 0);
    if (arm > 0) amount = Math.max(1, amount - arm);
    e.hp -= amount;
    e.hit = 0.14;
    b.dmgDealt += amount;
    if (e.hp <= 0) {
      e.dead = true;
      b.killed++;
      burst(b, e.x, e.y, e.def.color, e.def.boss ? 26 : 8, e.def.boss ? 160 : 110);
      if (e.def.boss) pushLog(b, '潮汐巨兽倒下了');
      else floatText(b, e.x, e.y - 14, '✦', color || '#ffd479', 15);

      /* 分裂：死亡时裂成两个小的 */
      if (e.def.split && !e._split) {
        e._split = true;
        var sdef = D.ENEMIES[e.def.split];
        if (sdef) {
          for (var si2 = 0; si2 < 2; si2++) {
            var shp = sdef.hp * (b.plan.hpMul || 1);
            b.enemies.push({
              id: b.seq++, kind: e.def.split, def: sdef, lane: sdef.lane, side: e.side,
              x: e.x + (si2 ? 16 : -16), y: e.y,
              hp: shp, maxHp: shp, r: sdef.r,
              latched: false, enraged: e.enraged, burnT: 0, burnDps: 0, slowT: 0, slowMul: 1,
              phase: 0, spdMul: 1, dmgMul: 1,
              bob: Math.random() * 6.283, hit: 0, dead: false, biteCd: 0
            });
          }
          floatText(b, e.x, e.y - 18, '分裂', '#9fd36a', 13);
        }
      }

      /* 燃烧羁绊：击杀时炸开 */
      if (b.st.fireBurst && !noBurst && !e._burst) {
        e._burst = true;
        b.blasts.push({ x: e.x, y: e.y, r: 90, life: 0.26, max: 0.26, color: '#e2703a' });
        for (var i = 0; i < b.enemies.length; i++) {
          var o = b.enemies[i];
          if (o === e || o.dead) continue;
          var dx = o.x - e.x, dy = o.y - e.y;
          if (dx * dx + dy * dy <= 90 * 90) hurt(b, o, b.st.fireBurst, '#e2703a', true);
        }
      }
    }
  }

  function acquire(b, m) {
    var lane = m.def.lane;
    var augR = m.aug && m.aug.rangeAdd ? m.aug.rangeAdd : 0;
    var rowR = (b.st.rowRange && b.st.rowRange[m.row]) || 0;
    var underR = lane === 'under' ? (b.st.underRange || 0) : 0;
    var reach = (m.def.range + b.st.rangeBonus + rowR + underR + augR) * CELL * (b.plan.rangeMul || 1) * (b.st.rangeMul || 1);
    var best = null, bestScore = Infinity;
    for (var i = 0; i < b.enemies.length; i++) {
      var e = b.enemies[i];
      if (e.dead) continue;
      if (lane !== 'any' && e.lane !== lane && !(m.aug && m.aug.cross)) continue;
      if (Math.abs(e.x - m.x) > reach) continue;
      if (e.def.stealth && Math.abs(e.x - m.x) > e.def.stealth) continue;
      var score = e.latched ? -1e6 : Math.abs(e.x - edgeX(e.side));
      if (m.aug && m.aug.far) score = -Math.abs(e.x - edgeX(e.side));
      if (score < bestScore) { bestScore = score; best = e; }
    }
    return best;
  }

  function fire(b, m, target) {
    var lane = m.def.lane;
    var aug = m.aug;
    var dmg = m.def.dmg * (1 + m.mag) * b.st.dmgMul * (b.st.laneDmg[lane] || 1) * (aug && aug.dmg ? aug.dmg : 1);
    var hits = [];
    var i, e;

    if (m.def.radius) {
      for (i = 0; i < b.enemies.length; i++) {
        e = b.enemies[i];
        if (e.dead) continue;
        var dx = e.x - target.x, dy = e.y - target.y;
        var rr2 = m.def.radius * (b.st.aoeMul || 1) * (aug && aug.radiusMul ? aug.radiusMul : 1);
        if (dx * dx + dy * dy <= rr2 * rr2) hits.push(e);
      }
      b.blasts.push({ x: target.x, y: target.y, r: m.def.radius * (b.st.aoeMul || 1), life: 0.3, max: 0.3, color: m.def.color });
    } else if (m.def.chain) {
      var pool = [];
      for (i = 0; i < b.enemies.length; i++) {
        e = b.enemies[i];
        if (e.dead) continue;
        var d2 = (e.x - target.x) * (e.x - target.x) + (e.y - target.y) * (e.y - target.y);
        if (d2 <= 140 * 140) pool.push({ e: e, d: d2 });
      }
      pool.sort(function (a, c) { return a.d - c.d; });
      for (i = 0; i < pool.length && hits.length < m.def.chain; i++) hits.push(pool[i].e);
    } else {
      hits.push(target);
    }

    if (aug && aug.pierce) {
      var extra = [];
      for (i = 0; i < b.enemies.length; i++) {
        e = b.enemies[i];
        if (e.dead || hits.indexOf(e) >= 0) continue;
        if (e.lane !== target.lane) continue;
        var pd = Math.abs(e.x - target.x);
        if (pd <= 220) extra.push({ e: e, d: pd });
      }
      extra.sort(function (a, c) { return a.d - c.d; });
      for (i = 0; i < extra.length && i < aug.pierce; i++) hits.push(extra[i].e);
    }

    if (aug && aug.splash) {
      for (i = 0; i < b.enemies.length; i++) {
        e = b.enemies[i];
        if (e.dead || hits.indexOf(e) >= 0) continue;
        var sdx = e.x - target.x, sdy = e.y - target.y;
        if (sdx * sdx + sdy * sdy <= aug.radius * aug.radius) {
          hurt(b, e, dmg * aug.splash, '#e2703a', true);
        }
      }
      b.blasts.push({ x: target.x, y: target.y, r: aug.radius, life: 0.22, max: 0.22, color: '#e2703a' });
    }

    for (i = 0; i < hits.length; i++) {
      hurt(b, hits[i], dmg, m.def.color);
      if (aug && aug.burn && !hits[i].dead) { hits[i].burnDps = aug.burn; hits[i].burnT = aug.burnT || 3; }
      if (aug && aug.slow && !hits[i].dead) { hits[i].slowMul = aug.slow; hits[i].slowT = aug.slowT || 2; }
      b.tracers.push({
        x1: m.x, y1: m.y,
        x2: hits[i].x, y2: hits[i].y,
        life: m.def.chain ? 0.16 : 0.09,
        max: m.def.chain ? 0.16 : 0.09,
        color: m.def.color,
        w: m.def.chain ? 2.4 : 1.6,
        arc: !!m.def.chain
      });
    }
    if (aug && aug.recharge) {
      for (i = 0; i < hits.length; i++) { if (hits[i].dead) { m.cd = 0; break; } }
    }
    m.flash = 0.1;
  }

  /* Boss 阶段：血量跨过阈值时换招式 */
  function checkPhase(b, e) {
    var phases = e.def.phases;
    if (!phases) return;
    var frac = e.hp / e.maxHp;
    while (e.phase < phases.length && frac <= phases[e.phase].at) {
      var ph = phases[e.phase];
      e.phase++;
      if (ph.spd) e.spdMul *= ph.spd;
      if (ph.dmg) e.dmgMul *= ph.dmg;
      if (ph.lane && ph.lane !== e.lane) {
        e.lane = ph.lane;
        e.y = laneY(b, ph.lane);
      }
      if (ph.summon) {
        ph.summon.forEach(function (kind, si) {
          var def = D.ENEMIES[kind];
          var hp2 = def.hp * b.plan.hpMul;
          b.enemies.push({
            id: b.seq++, kind: kind, def: def, lane: def.lane, side: e.side,
            x: e.x + (si - 1) * 46, y: laneY(b, def.lane),
            hp: hp2, maxHp: hp2, r: def.r,
            latched: false, enraged: false, burnT: 0, burnDps: 0, slowT: 0, slowMul: 1,
            phase: 0, spdMul: 1, dmgMul: 1,
            bob: Math.random() * 6.283, hit: 0, dead: false, biteCd: 0
          });
        });
      }
      pushLog(b, '【' + e.def.name + '】' + ph.text);
      floatText(b, e.x, e.y - e.r - 26, ph.text, '#ff8b6b', 17);
      burst(b, e.x, e.y, e.def.color, 26, 150);
      b.shake = Math.min(12, b.shake + 6);
    }
  }

  function step(b, dt) {
    if (b.result) return;
    dt = clamp(dt, 0, 0.05);
    b.t += dt;

    /* 潮位 */
    if (b.tide < 1) {
      b.tide = Math.min(1, b.tide + (dt / b.tideDur) * b.tideMul);
      if (b.tide >= 1 && !b.enraged) {
        b.enraged = true;
        if (!b.tideChild) b.enemies.forEach(function (e) { e.enraged = true; });
        pushLog(b, b.tideChild ? '满潮 · 船舱开始进水（潮汐之子：敌群没有狂暴）' : '满潮 · 敌群狂暴，船舱开始进水');
        floatText(b, D.VIEW_W / 2, 118, '满 潮 · 敌 群 狂 暴', '#ff8b6b', 26);
        floatText(b, D.VIEW_W / 2, 148, '海水开始灌进船舱', '#7fc8e8', 15);
      }
    }
    b.waterY = D.WATER_LOW + (D.WATER_HIGH - D.WATER_LOW) * b.tide;

    if (b.enraged) {
      b.hp -= 3.5 * dt;
      b.leak += 3.5 * dt;
    }

    var flooded = b.waterY < D.FLOOD_Y;
    for (var mi = 0; mi < b.modules.length; mi++) {
      var m = b.modules[mi];
      m.flooded = (m.row === 1) && flooded;
      if (m.flash > 0) m.flash -= dt;
    }

    /* 出场 */
    while (b.queue.length && b.t >= b.queue[0].t) {
      var s = b.queue.shift();
      spawn(b, s);
      if (D.ENEMIES[s.kind].boss) pushLog(b, '潮汐巨兽浮出水面（' + (s.side === 'L' ? '左舷' : '右舷') + '）');
    }

    /* 移动 + 啃咬 */
    for (var ei = 0; ei < b.enemies.length; ei++) {
      var e = b.enemies[ei];
      if (e.dead) continue;
      if (e.lane === 'surface') e.y = b.waterY - 10;
      if (e.hit > 0) e.hit -= dt;
      checkPhase(b, e);
      if (e.burnT > 0) {
        e.burnT -= dt;
        hurt(b, e, e.burnDps * dt, '#e2703a', true);
        if (e.dead) continue;
      }
      if (e.slowT > 0) e.slowT -= dt;
      if (e.def.spawn) {
        e.spawnT = (e.spawnT || e.def.spawnCd || 4) - dt;
        if (e.spawnT <= 0) {
          e.spawnT = e.def.spawnCd || 4;
          var sdef2 = D.ENEMIES[e.def.spawn];
